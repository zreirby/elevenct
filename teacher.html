<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a10" />
  <title>Панель учителя • @physarea.ct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090a10;
      --surface-card: rgba(18, 22, 34, 0.76);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: clip;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.14) 0px, transparent 45%),
        radial-gradient(at 90% 25%, rgba(168, 85, 247, 0.13) 0px, transparent 45%),
        radial-gradient(at 50% 85%, rgba(251, 113, 133, 0.10) 0px, transparent 45%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 10, 16, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-left, .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { font-size: 16px; font-weight: 800; color: #fff; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.13); }
    .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border-color: transparent; color: #fff; }
    .btn-danger { background: rgba(244, 63, 94, 0.14); border-color: rgba(244, 63, 94, 0.35); color: #fda4af; }

    main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }

    .denied-box {
      max-width: 460px;
      margin: 60px auto;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px 24px;
      text-align: center;
    }
    .denied-box h2 { margin-bottom: 10px; }
    .denied-box p { color: var(--text-sub); margin-bottom: 20px; font-size: 14px; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      backdrop-filter: blur(20px);
    }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-value { font-size: 26px; font-weight: 800; margin-top: 4px; font-family: var(--mono); }

    .panel {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
      backdrop-filter: blur(24px);
      margin-bottom: 20px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .panel-title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .panel-hint { font-size: 13px; color: var(--text-sub); }

    .group-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    /* ТОП-3 общий по всем ученикам */
    .top3-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .rank-row.top-1 {
      background: linear-gradient(90deg, rgba(250, 204, 21, 0.13), rgba(255, 255, 255, 0.03));
      border-color: rgba(250, 204, 21, 0.32);
    }
    .rank-row.top-2 {
      background: linear-gradient(90deg, rgba(203, 213, 225, 0.11), rgba(255, 255, 255, 0.03));
      border-color: rgba(203, 213, 225, 0.25);
    }
    .rank-row.top-3 {
      background: linear-gradient(90deg, rgba(251, 146, 60, 0.11), rgba(255, 255, 255, 0.03));
      border-color: rgba(251, 146, 60, 0.25);
    }
    .rank-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .rank-pos {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 800;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }
    .rank-name { font-weight: 700; font-size: 14px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-sub { font-size: 11px; color: var(--text-muted); font-family: var(--mono); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rank-metrics { text-align: right; flex-shrink: 0; }
    .rank-score { font-family: var(--mono); font-weight: 800; font-size: 15px; color: #6ee7b7; }
    .rank-extra { font-size: 11px; color: var(--text-sub); font-family: var(--mono); }

    /* Фильтр по группам для таблицы ДЗ */
    .group-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .group-tab {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 13px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }
    .group-tab:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .group-tab.active {
      color: #ffffff;
    }
    .tab-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tab-count {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Таблица ДЗ */
    .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 13px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid rgba(255, 255, 255, 0.04); text-align: center; }
    th { background: rgba(15, 20, 32, 0.95); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #cbd5e1; white-space: nowrap; }
    th:first-child, td:first-child {
      position: sticky; left: 0; z-index: 2;
      background: rgba(16, 20, 32, 0.97);
      text-align: left; padding-left: 14px; min-width: 195px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }
    th:first-child { z-index: 3; }

    .student-cell { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .student-name { font-weight: 700; color: #fff; font-size: 13px; }
    .student-login { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
    .edit-name-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 13px; }
    .edit-name-btn:hover { color: #fff; }

    .cell-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px;
      color: #e2e8f0;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .cell-btn:hover { border-color: rgba(255, 255, 255, 0.25); }
    .cell-btn.good { background: rgba(16, 185, 129, 0.14); border-color: rgba(16, 185, 129, 0.32); color: #6ee7b7; }
    .cell-btn.mid { background: rgba(245, 158, 11, 0.13); border-color: rgba(245, 158, 11, 0.32); color: #fcd34d; }
    .cell-btn.bad { background: rgba(244, 63, 94, 0.13); border-color: rgba(244, 63, 94, 0.32); color: #fda4af; }
    .cell-empty { color: var(--text-muted); font-family: var(--mono); }

    .detail-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(5, 6, 10, 0.8);
      backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .detail-backdrop.open { display: flex; }
    .detail-card {
      width: 100%; max-width: 640px; max-height: 85vh;
      display: flex; flex-direction: column;
      background: #121622;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }
    .detail-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail-head h3 { font-size: 18px; font-weight: 800; }
    .detail-sub { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
    .detail-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .detail-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

    .task-row {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 12px 14px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
    }
    .task-row-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .task-num-tag { font-family: var(--mono); font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 8px; background: rgba(99, 102, 241, 0.16); color: #c7d2fe; }
    .badge-ok { color: #34d399; font-weight: 700; font-size: 13px; }
    .badge-err { color: #fb7185; font-weight: 700; font-size: 13px; }
    .badge-warn { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .task-meta { font-size: 12px; color: var(--text-sub); font-family: var(--mono); }

    @media (max-width: 520px) {
      .top3-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="btn" href="index.html">← К заданиям</a>
      <span class="brand">@physarea.ct • Учитель</span>
    </div>
    <div class="header-right">
      <button class="btn" id="btn-refresh" type="button">↻ Обновить</button>
      <button class="btn" id="btn-csv" type="button">⬇ CSV</button>
      <button class="btn btn-danger" id="btn-logout" type="button">Выйти</button>
    </div>
  </header>

  <main id="app-root">
    <div class="denied-box">
      <h2>Загрузка...</h2>
      <p>Проверяем права доступа</p>
    </div>
  </main>

  <div class="detail-backdrop" id="detail-modal">
    <div class="detail-card">
      <div class="detail-head">
        <div>
          <h3 id="modal-title">Детали</h3>
          <div class="detail-sub" id="modal-sub"></div>
        </div>
        <button class="btn" id="modal-close" type="button">✕</button>
      </div>
      <div class="detail-body" id="modal-body"></div>
      <div class="detail-foot">
        <button class="btn btn-danger" id="modal-reset-dz" type="button">Сбросить это ДЗ</button>
        <button class="btn btn-primary" id="modal-ok" type="button">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const DEFAULT_DZ_LIST = [
      { key: "dz1", title: "ДЗ 1 • РПД" },
      { key: "dz2", title: "ДЗ 2 • РУД" },
      { key: "dz3", title: "ДЗ 3 • Свободное падение" },
      { key: "dz4", title: "ДЗ 4 • Движение по окружности" },
      { key: "dz5", title: "ДЗ 5 • Законы Ньютона" },
      { key: "dz6", title: "ДЗ 6 • Трение. Наклонная" },
      { key: "dz7", title: "ДЗ 7 • Упругость. Тяготение" },
      { key: "dz8", title: "ДЗ 8 • Динамика по окружности" },
      { key: "dz9", title: "ДЗ 9 • Импульс" },
      { key: "dz10", title: "ДЗ 10 • Работа. Мощность" }
    ];

    let DZ_LIST = [...DEFAULT_DZ_LIST];
    let allStudents = [];
    let selectedGroup = "ALL";
    let activeDetail = null;

    function esc(s) {
      return window.PhysAuth ? window.PhysAuth.escapeHtml(s) : String(s ?? "");
    }

    function formatStudentPrimaryName(st) {
      if (st.displayName) return st.displayName;
      if (st.parsed?.valid) {
        return `Ученик №${Number(st.parsed.studentNum)} (${st.parsed.code})`;
      }
      return st.login || "без имени";
    }

    async function buildDzList(students) {
      const map = new Map();
      DEFAULT_DZ_LIST.forEach((d) => map.set(d.key, d.title));

      try {
        const resp = await fetch("index.html", { cache: "no-store" });
        if (resp.ok) {
          const html = await resp.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          doc.querySelectorAll(".nav-btn[href]").forEach((a) => {
            const href = a.getAttribute("href") || "";
            const m = href.match(/^(?:\.\/)?(dz\d+)\//i);
            if (!m) return;
            const key = m[1].toLowerCase();
            const numText = a.querySelector(".btn-num")?.textContent.trim() || key.replace(/\D/g, "");
            const titleText = a.querySelector(".btn-title")?.textContent.trim() || "";
            map.set(key, titleText ? `ДЗ ${numText} • ${titleText}` : `ДЗ ${numText}`);
          });
        }
      } catch (e) {}

      students.forEach((st) => {
        Object.keys(st.dz || {}).forEach((rawKey) => {
          const key = rawKey.toLowerCase();
          if (/^dz\d+$/i.test(key) && !map.has(key)) {
            map.set(key, `ДЗ ${key.replace(/\D/g, "")}`);
          }
        });
      });

      return Array.from(map.entries())
        .sort((a, b) => Number(a[0].replace(/\D/g, "")) - Number(b[0].replace(/\D/g, "")))
        .map(([key, title]) => ({ key, title }));
    }

    async function loadDashboard() {
      const root = document.getElementById("app-root");
      const PA = window.PhysAuth;
      if (!PA || !PA.getUser()) return;

      if (!PA.isTeacher()) {
        root.innerHTML = `
          <div class="denied-box">
            <h2>Доступ закрыт</h2>
            <p>Вы вошли как ученик (<strong>${esc(PA.getLoginFromEmail(PA.getUser().email))}</strong>). Эта страница открывается только под аккаунтом преподавателя.</p>
            <a class="btn btn-primary" href="index.html">Вернуться к заданиям</a>
          </div>
        `;
        return;
      }

      root.innerHTML = `<div class="denied-box"><h2>Загружаем ответы...</h2><p>Читаем базу учеников и формируем ТОП-3</p></div>`;

      try {
        const snap = await PA.getDb().collection("students").get();
        allStudents = [];
        snap.forEach((doc) => {
          const data = doc.data();
          if (data.email === PA.teacherEmail) return;
          const login = data.login || PA.getLoginFromEmail(data.email || "");
          const parsed = PA.parseStudentLogin(login);
          const stats = PA.computeRatingStats(data);
          allStudents.push({ uid: doc.id, ...data, login, parsed, stats });
        });

        DZ_LIST = await buildDzList(allStudents);

        // Фоново синхронизируем коллекцию ratings без секретных полей
        const del = firebase.firestore.FieldValue.delete();
        allStudents.forEach((st) => {
          const rPayload = {
            groupKey: st.parsed.groupKey,
            groupLabel: st.parsed.groupLabel,
            grade: st.parsed.grade || null,
            login: del,
            email: del,
            studentNum: del,
            code: del,
            ...st.stats,
            updatedAt: st.updatedAt || new Date().toISOString()
          };
          if (st.displayName) rPayload.displayName = st.displayName;
          PA.getDb().collection("ratings").doc(st.uid).set(rPayload, { merge: true }).catch(() => {});
        });

        renderDashboard();
      } catch (err) {
        console.error(err);
        root.innerHTML = `
          <div class="denied-box">
            <h2>Ошибка чтения базы</h2>
            <p>Проверьте правила Firestore (раздел Rules) и авторизацию учителя.</p>
          </div>
        `;
      }
    }

    function sortForRanking(list) {
      return [...list].sort((a, b) => {
        if (b.stats.totalCorrect !== a.stats.totalCorrect) {
          return b.stats.totalCorrect - a.stats.totalCorrect;
        }
        if (b.stats.firstTryCorrect !== a.stats.firstTryCorrect) {
          return b.stats.firstTryCorrect - a.stats.firstTryCorrect;
        }
        if (a.stats.totalAttempts !== b.stats.totalAttempts) {
          return a.stats.totalAttempts - b.stats.totalAttempts;
        }
        return formatStudentPrimaryName(a).localeCompare(formatStudentPrimaryName(b), "ru");
      });
    }

    function renderDashboard() {
      const root = document.getElementById("app-root");
      const PA = window.PhysAuth;

      const groupsMap = new Map();
      allStudents.forEach((st) => {
        const gKey = st.parsed.groupKey;
        if (!groupsMap.has(gKey)) {
          groupsMap.set(gKey, { key: gKey, label: st.parsed.groupLabel, students: [] });
        }
        groupsMap.get(gKey).students.push(st);
      });

      const orderedGroupKeys = PA.sortGroupKeys(Array.from(groupsMap.keys()));
      if (selectedGroup !== "ALL" && !groupsMap.has(selectedGroup)) {
        selectedGroup = "ALL";
      }

      const visibleStudents =
        selectedGroup === "ALL" ? allStudents : (groupsMap.get(selectedGroup)?.students || []);

      let totalSolved = 0;
      let totalCorrect = 0;
      visibleStudents.forEach((st) => {
        totalSolved += st.stats.totalSolved;
        totalCorrect += st.stats.totalCorrect;
      });
      const avgPct = totalSolved ? Math.round((totalCorrect / totalSolved) * 100) : 0;

      // Общий ТОП-3 среди ВСЕХ учеников
      const top3 = sortForRanking(allStudents.filter((st) => st.stats.totalCorrect > 0)).slice(0, 3);
      let top3Html = "";
      if (top3.length === 0) {
        top3Html = `<div style="color:#94a3b8; font-size:14px;">Пока никто из учеников не решил ни одной задачи верно.</div>`;
      } else {
        top3Html = `<div class="top3-grid">` + top3
          .map((st, idx) => {
            const pos = idx + 1;
            const medal = pos === 1 ? "🥇" : pos === 2 ? "🥈" : "🥉";
            const pct = st.stats.totalSolved
              ? Math.round((st.stats.totalCorrect / st.stats.totalSolved) * 100)
              : 0;
            const badgeStyle = PA.getGroupBadgeStyleAttr(st.parsed.groupKey);
            const codeInfo = st.parsed.valid ? `${st.parsed.grade} кл · ${st.parsed.code}` : st.login;

            return `
              <div class="rank-row top-${pos}">
                <div class="rank-left">
                  <div class="rank-pos">${medal}</div>
                  <div style="min-width:0">
                    <div class="rank-name">${esc(formatStudentPrimaryName(st))}</div>
                    <div class="rank-sub">
                      <span class="group-badge" style="${badgeStyle}">${esc(st.parsed.groupLabel)}</span>
                      <span>${esc(codeInfo)}</span>
                    </div>
                  </div>
                </div>
                <div class="rank-metrics">
                  <div class="rank-score">${st.stats.totalCorrect} верно</div>
                  <div class="rank-extra">с 1-й поп: ${st.stats.firstTryCorrect} · ${pct}%</div>
                </div>
              </div>
            `;
          })
          .join("") + `</div>`;
      }

      // Вкладки фильтра по группам для таблицы ДЗ (каждая со своим цветом)
      const groupTabsHtml = [
        `<button class="group-tab ${selectedGroup === "ALL" ? "active" : ""}" style="${selectedGroup === "ALL" ? "background:rgba(99,102,241,0.22); border-color:rgba(99,102,241,0.55);" : ""}" data-group="ALL" type="button">
          Все группы <span class="tab-count">${allStudents.length}</span>
        </button>`,
        ...orderedGroupKeys.map((gKey) => {
          const g = groupsMap.get(gKey);
          const c = PA.getGroupStyle(gKey);
          const isActive = selectedGroup === gKey;
          const activeStyle = isActive ? `background:${c.bg}; border-color:${c.border}; color:${c.text};` : "";
          return `
            <button class="group-tab ${isActive ? "active" : ""}" style="${activeStyle}" data-group="${esc(gKey)}" type="button">
              <span class="tab-dot" style="background:${c.accent}; box-shadow:0 0 8px ${c.accent};"></span>
              ${esc(g.label)} <span class="tab-count">${g.students.length}</span>
            </button>
          `;
        })
      ].join("");

      const headerCols = DZ_LIST.map((d) => {
        const num = d.key.replace(/\D/g, "");
        return `<th title="${esc(d.title)}">ДЗ ${esc(num)}</th>`;
      }).join("");

      const sortedTableStudents = sortForRanking(visibleStudents);
      let rowsHtml = "";
      if (sortedTableStudents.length === 0) {
        rowsHtml = `
          <tr>
            <td colspan="${DZ_LIST.length + 1}" style="text-align:center; padding:30px; color:#94a3b8;">
              Пока ни один ученик не заходил на сайт.
            </td>
          </tr>
        `;
      } else {
        rowsHtml = sortedTableStudents
          .map((st) => {
            const badgeStyle = PA.getGroupBadgeStyleAttr(st.parsed.groupKey);
            const cells = DZ_LIST.map((dz) => {
              const tasks = st.dz?.[dz.key];
              if (!tasks || Object.keys(tasks).length === 0) {
                return `<td><span class="cell-empty">—</span></td>`;
              }
              const list = Object.values(tasks);
              const ok = list.filter((t) => t.isCorrect).length;
              const total = st.dzMeta?.[dz.key]?.total;
              const denom = total || list.length;
              const ratio = denom ? ok / denom : 0;
              const cls = ratio >= 0.8 ? "good" : ratio >= 0.45 ? "mid" : "bad";
              const text = total ? `${ok}/${total}` : `${ok} ✓ (${list.length})`;
              return `<td><button class="cell-btn ${cls}" data-uid="${esc(st.uid)}" data-dz="${esc(dz.key)}" type="button">${esc(text)}</button></td>`;
            }).join("");

            return `
              <tr>
                <td>
                  <div class="student-cell">
                    <div>
                      <div class="student-name">${esc(formatStudentPrimaryName(st))}</div>
                      <div style="display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap;">
                        <span class="group-badge" style="${badgeStyle}">${esc(st.parsed.groupLabel)}</span>
                        <span class="student-login">${esc(st.parsed.raw)}</span>
                      </div>
                    </div>
                    <button class="edit-name-btn" data-rename-uid="${esc(st.uid)}" title="Изменить имя" type="button">✎</button>
                  </div>
                </td>
                ${cells}
              </tr>
            `;
          })
          .join("");
      }

      root.innerHTML = `
        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Учеников</div>
            <div class="stat-value">${visibleStudents.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Групп</div>
            <div class="stat-value">${orderedGroupKeys.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Всего ответов</div>
            <div class="stat-value">${totalSolved}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Верных ответов</div>
            <div class="stat-value" style="color:#34d399">${avgPct}%</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <div class="panel-title">🏆 ТОП-3 лучших (из всех учеников)</div>
            <span class="panel-hint">Общий зачёт по всем группам</span>
          </div>
          ${top3Html}
        </div>

        <div class="panel">
          <div class="panel-head">
            <div>
              <div class="panel-title">Успеваемость по заданиям</div>
              <div class="panel-hint">Нажмите на ячейку с баллами, чтобы увидеть каждую задачу и количество попыток</div>
            </div>
          </div>

          <div class="group-tabs">${groupTabsHtml}</div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Ученик</th>
                  ${headerCols}
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;

      root.querySelectorAll(".group-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          selectedGroup = tab.dataset.group;
          renderDashboard();
        });
      });

      root.querySelectorAll(".cell-btn").forEach((btn) => {
        btn.addEventListener("click", () => openDetailModal(btn.dataset.uid, btn.dataset.dz));
      });

      root.querySelectorAll("[data-rename-uid]").forEach((btn) => {
        btn.addEventListener("click", () => renameStudent(btn.dataset.renameUid));
      });
    }

    async function renameStudent(uid) {
      const st = allStudents.find((s) => s.uid === uid);
      if (!st) return;
      const current = st.displayName || formatStudentPrimaryName(st);
      const nextName = prompt("Введите имя и фамилию ученика:", current);
      if (nextName === null) return;
      const clean = nextName.trim();
      try {
        const db = window.PhysAuth.getDb();
        await db.collection("students").doc(uid).set({ displayName: clean }, { merge: true });
        await db.collection("ratings").doc(uid).set({ displayName: clean }, { merge: true }).catch(() => {});
        st.displayName = clean;
        renderDashboard();
      } catch (err) {
        alert("Не удалось сохранить имя: " + err.message);
      }
    }

    function openDetailModal(uid, dzKey) {
      const st = allStudents.find((s) => s.uid === uid);
      const dzInfo = DZ_LIST.find((d) => d.key === dzKey) || { key: dzKey, title: dzKey.toUpperCase() };
      if (!st) return;

      activeDetail = { uid, dzKey };
      const tasks = st.dz?.[dzKey] || {};
      const entries = Object.entries(tasks).sort(
        (a, b) => Number(a[0].replace(/^t/, "")) - Number(b[0].replace(/^t/, ""))
      );

      const okCount = entries.filter(([, e]) => e.isCorrect).length;
      const total = st.dzMeta?.[dzKey]?.total;

      document.getElementById("modal-title").textContent = `${formatStudentPrimaryName(st)} — ${dzInfo.title}`;
      document.getElementById("modal-sub").textContent =
        `${st.parsed.groupLabel} · Верно: ${okCount}` + (total ? ` из ${total}` : ` (решалось: ${entries.length})`);

      const body = document.getElementById("modal-body");
      if (entries.length === 0) {
        body.innerHTML = `<div style="color:#94a3b8">Нет сохранённых ответов.</div>`;
      } else {
        body.innerHTML = entries
          .map(([tKey, e]) => {
            const num = tKey.replace(/^t/, "");
            const statusHtml = e.isCorrect
              ? `<span class="badge-ok">✓ Верно</span>`
              : `<span class="badge-err">✕ Неверно</span>`;
            const attemptWarn =
              e.attempts > 1
                ? `<span class="badge-warn">Попыток: ${e.attempts}${e.firstCorrect ? "" : " (1-я: ✕)"}</span>`
                : `<span class="task-meta">с 1-й попытки</span>`;
            const dt = e.updatedAt
              ? new Date(e.updatedAt).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
              : "";

            return `
              <div class="task-row">
                <div class="task-row-left">
                  <span class="task-num-tag">№ ${esc(num)}</span>
                  ${statusHtml}
                  ${attemptWarn}
                </div>
                <div class="task-meta">Ответ: <strong>${esc(e.answer)}</strong> ${dt ? "· " + esc(dt) : ""}</div>
              </div>
            `;
          })
          .join("");
      }

      document.getElementById("detail-modal").classList.add("open");
    }

    function closeDetailModal() {
      document.getElementById("detail-modal").classList.remove("open");
      activeDetail = null;
    }

    document.getElementById("modal-close").addEventListener("click", closeDetailModal);
    document.getElementById("modal-ok").addEventListener("click", closeDetailModal);
    document.getElementById("detail-modal").addEventListener("click", (e) => {
      if (e.target.id === "detail-modal") closeDetailModal();
    });

    document.getElementById("modal-reset-dz").addEventListener("click", async () => {
      if (!activeDetail) return;
      const { uid, dzKey } = activeDetail;
      if (!confirm("Точно удалить все ответы ученика за это ДЗ?")) return;
      try {
        const PA = window.PhysAuth;
        await PA.getDb()
          .collection("students")
          .doc(uid)
          .update({ [`dz.${dzKey}`]: firebase.firestore.FieldValue.delete() });
        const st = allStudents.find((s) => s.uid === uid);
        if (st && st.dz) {
          delete st.dz[dzKey];
          st.stats = PA.computeRatingStats(st);
          await PA.getDb().collection("ratings").doc(uid).set(st.stats, { merge: true }).catch(() => {});
        }
        closeDetailModal();
        renderDashboard();
      } catch (err) {
        alert("Ошибка сброса: " + err.message);
      }
    });

    document.getElementById("btn-refresh").addEventListener("click", loadDashboard);
    document.getElementById("btn-logout").addEventListener("click", () => {
      window.PhysAuth?.getAuth()?.signOut();
    });

    document.getElementById("btn-csv").addEventListener("click", () => {
      const headers = ["Группа", "Ученик", "Логин", "Верно всего", "С 1-й попытки", ...DZ_LIST.map((d) => d.title)];
      const rows = [headers];
      sortForRanking(allStudents).forEach((st) => {
        const line = [
          st.parsed.groupLabel,
          formatStudentPrimaryName(st),
          st.parsed.raw,
          st.stats.totalCorrect,
          st.stats.firstTryCorrect
        ];
        DZ_LIST.forEach((dz) => {
          const tasks = st.dz?.[dz.key];
          if (!tasks) {
            line.push("0");
          } else {
            const list = Object.values(tasks);
            const ok = list.filter((t) => t.isCorrect).length;
            const total = st.dzMeta?.[dz.key]?.total;
            line.push(total ? `${ok}/${total}` : `${ok}`);
          }
        });
        rows.push(line);
      });
      const csv = "\uFEFF" + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "physarea-results.csv";
      a.click();
    });

    window.addEventListener("physauth:ready", loadDashboard);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a10" />
  <title>ТОП-3 лучших • Физика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090a10;
      --surface-card: rgba(18, 22, 34, 0.74);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border: rgba(255, 255, 255, 0.08);
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "JetBrains Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: clip;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.14) 0px, transparent 45%),
        radial-gradient(at 85% 30%, rgba(168, 85, 247, 0.13) 0px, transparent 45%),
        radial-gradient(at 50% 85%, rgba(251, 113, 133, 0.10) 0px, transparent 45%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(9, 10, 16, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    main { max-width: 680px; margin: 0 auto; padding: 28px 16px 60px; }

    .hero { text-align: center; margin-bottom: 24px; }
    .hero-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .hero h1 {
      font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .hero p { color: var(--text-sub); font-size: 15px; }

    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; gap: 10px; flex-wrap: wrap;
    }
    .card-title { font-size: 15px; font-weight: 800; color: #fff; }
    .card-sub { font-size: 12px; color: var(--text-sub); }

    .rank-list { display: flex; flex-direction: column; gap: 10px; }
    .rank-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-radius: 16px;
      background: rgba(26, 32, 48, 0.8);
      border: 1px solid var(--border);
    }
    .rank-row.is-me {
      border-color: rgba(99, 102, 241, 0.65);
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3), 0 10px 24px rgba(99, 102, 241, 0.18);
    }
    .rank-row.top-1 { background: linear-gradient(90deg, rgba(250, 204, 21, 0.14), rgba(26, 32, 48, 0.86)); border-color: rgba(250, 204, 21, 0.28); }
    .rank-row.top-2 { background: linear-gradient(90deg, rgba(203, 213, 225, 0.12), rgba(26, 32, 48, 0.86)); border-color: rgba(203, 213, 225, 0.24); }
    .rank-row.top-3 { background: linear-gradient(90deg, rgba(251, 146, 60, 0.12), rgba(26, 32, 48, 0.86)); border-color: rgba(251, 146, 60, 0.24); }

    .rank-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .rank-pos {
      width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-weight: 800; font-size: 18px;
      background: rgba(255, 255, 255, 0.07);
    }
    .rank-name { font-weight: 700; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .me-tag {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px;
      background: rgba(99, 102, 241, 0.25); color: #c7d2fe;
    }
    .rank-meta-line {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 5px;
    }
    .group-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .rank-metrics { text-align: right; flex-shrink: 0; }
    .rank-score { font-family: var(--mono); font-weight: 800; font-size: 16px; color: #6ee7b7; white-space: nowrap; }
    .rank-extra { font-size: 11px; color: var(--text-sub); font-family: var(--mono); white-space: nowrap; }

    .my-summary {
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: 16px;
      background: rgba(18, 22, 34, 0.65);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-sub);
    }
    .my-summary strong { color: #fff; font-family: var(--mono); }

    .empty-note { text-align: center; color: var(--text-sub); padding: 24px 10px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <a class="btn" href="index.html">← Все задания</a>
    <span style="font-weight:800; font-size:15px;">@physarea.ct</span>
    <button class="btn" id="btn-logout" type="button">Выйти</button>
  </header>

  <main>
    <div class="hero">
      <div class="hero-badge">Общий зачёт</div>
      <h1>ТОП-3 лучших</h1>
      <p id="hero-sub">Лидеры среди всех учеников</p>
    </div>

    <div class="card" id="rating-card">
      <div class="empty-note">Загружаем данные...</div>
    </div>

    <div id="my-summary-wrap"></div>
  </main>

  <script src="auth.js?v=4"></script>
  <script>
    const FALLBACK_PALETTE = [
      { bg: "rgba(56, 189, 248, 0.15)", border: "rgba(56, 189, 248, 0.38)", text: "#bae6fd" },
      { bg: "rgba(16, 185, 129, 0.16)", border: "rgba(16, 185, 129, 0.40)", text: "#6ee7b7" },
      { bg: "rgba(244, 63, 94, 0.16)", border: "rgba(244, 63, 94, 0.40)", text: "#fda4af" },
      { bg: "rgba(99, 102, 241, 0.18)", border: "rgba(99, 102, 241, 0.44)", text: "#c7d2fe" },
      { bg: "rgba(20, 184, 166, 0.16)", border: "rgba(20, 184, 166, 0.40)", text: "#99f6e4" },
      { bg: "rgba(249, 115, 22, 0.16)", border: "rgba(249, 115, 22, 0.40)", text: "#fed7aa" },
      { bg: "rgba(236, 72, 153, 0.16)", border: "rgba(236, 72, 153, 0.40)", text: "#fbcfe8" },
      { bg: "rgba(132, 204, 22, 0.16)", border: "rgba(132, 204, 22, 0.40)", text: "#d9f99d" }
    ];

    function esc(s) {
      return window.PhysAuth ? window.PhysAuth.escapeHtml(s) : String(s ?? "");
    }

    function safeGetGroupBadgeStyleAttr(groupKey) {
      if (window.PhysAuth?.getGroupBadgeStyleAttr) return window.PhysAuth.getGroupBadgeStyleAttr(groupKey);
      const key = String(groupKey || "UNKNOW").toUpperCase();
      let c;
      if (key === "UNKNOW") c = { bg: "rgba(245,158,11,0.16)", border: "rgba(245,158,11,0.40)", text: "#fde68a" };
      else if (key === "IN") c = { bg: "rgba(168,85,247,0.17)", border: "rgba(168,85,247,0.42)", text: "#e9d5ff" };
      else {
        const num = parseInt(key, 10);
        if (!isNaN(num) && num >= 1 && num <= FALLBACK_PALETTE.length) c = FALLBACK_PALETTE[num - 1];
        else {
          const hue = Math.round(((Math.max(1, num || 1) - 1) * 137.508) % 360);
          c = { bg: `hsla(${hue},78%,55%,0.16)`, border: `hsla(${hue},78%,60%,0.40)`, text: `hsl(${hue},85%,82%)` };
        }
      }
      return `background:${c.bg}; border-color:${c.border}; color:${c.text};`;
    }

    function formatName(entry) {
      return entry.displayName || "Участник";
    }

    function sortRanking(list) {
      return [...list].sort((a, b) => {
        if ((b.totalCorrect || 0) !== (a.totalCorrect || 0)) return (b.totalCorrect || 0) - (a.totalCorrect || 0);
        if ((b.firstTryCorrect || 0) !== (a.firstTryCorrect || 0)) return (b.firstTryCorrect || 0) - (a.firstTryCorrect || 0);
        if ((a.totalAttempts || 0) !== (b.totalAttempts || 0)) return (a.totalAttempts || 0) - (b.totalAttempts || 0);
        return formatName(a).localeCompare(formatName(b), "ru");
      });
    }

    async function loadRating() {
      const PA = window.PhysAuth;
      const card = document.getElementById("rating-card");
      const heroSub = document.getElementById("hero-sub");
      const summaryWrap = document.getElementById("my-summary-wrap");
      if (!PA || !PA.getUser()) return;

      const user = PA.getUser();
      const isTeacher = PA.isTeacher();

      if (!isTeacher && !PA.showRatingToStudents) {
        heroSub.textContent = "Доступ ограничен";
        card.innerHTML = `<div class="empty-note">Рейтинг сейчас скрыт преподавателем.</div>`;
        summaryWrap.innerHTML = "";
        return;
      }

      try {
        const snap = await PA.getDb().collection("ratings").get();
        const allEntries = [];
        snap.forEach((doc) => {
          const d = doc.data();
          if (!d.groupKey) return;
          allEntries.push({
            uid: doc.id,
            displayName: d.displayName || "",
            groupKey: d.groupKey,
            groupLabel: d.groupLabel || (d.groupKey === "IN" ? "Индивидуально (IN)" : d.groupKey === "UNKNOW" ? "UNKNOW" : `Группа №${Number(d.groupKey)}`),
            totalCorrect: d.totalCorrect || 0,
            firstTryCorrect: d.firstTryCorrect || 0,
            totalAttempts: d.totalAttempts || 0
          });
        });

        const activeRanked = sortRanking(allEntries.filter((e) => e.totalCorrect > 0));
        const top3 = activeRanked.slice(0, 3);

        if (top3.length === 0) {
          card.innerHTML = `<div class="empty-note">Пока никто не решил ни одной задачи — станьте первым в ТОП-3!</div>`;
        } else {
          const rows = top3
            .map((e, idx) => {
              const pos = idx + 1;
              const medal = pos === 1 ? "🥇" : pos === 2 ? "🥈" : "🥉";
              const isMe = e.uid === user.uid;
              const groupStyle = safeGetGroupBadgeStyleAttr(e.groupKey);

              return `
                <div class="rank-row top-${pos} ${isMe ? "is-me" : ""}">
                  <div class="rank-left">
                    <div class="rank-pos">${medal}</div>
                    <div style="min-width:0">
                      <div class="rank-name">
                        ${esc(formatName(e))}
                        ${isMe ? `<span class="me-tag">Вы</span>` : ""}
                      </div>
                      <div class="rank-meta-line">
                        <span class="group-pill" style="${groupStyle}">${esc(e.groupLabel)}</span>
                      </div>
                    </div>
                  </div>
                  <div class="rank-metrics">
                    <div class="rank-score">${e.totalCorrect} верно</div>
                    <div class="rank-extra">с 1 попытки: ${e.firstTryCorrect}</div>
                  </div>
                </div>
              `;
            })
            .join("");

          card.innerHTML = `
            <div class="card-head">
              <span class="card-title">Лидеры курса</span>
              <span class="card-sub">Всего участников: ${allEntries.length}</span>
            </div>
            <div class="rank-list">${rows}</div>
          `;
        }

        if (!isTeacher) {
          const myIndex = activeRanked.findIndex((e) => e.uid === user.uid);
          if (myIndex >= 3) {
            const me = activeRanked[myIndex];
            summaryWrap.innerHTML = `
              <div class="my-summary">
                <span>Ваш личный результат в общем зачёте:</span>
                <span><strong>#${myIndex + 1}</strong> из ${activeRanked.length} · <strong>${me.totalCorrect}</strong> верно</span>
              </div>
            `;
          } else if (myIndex === -1) {
            summaryWrap.innerHTML = `
              <div class="my-summary">
                <span>Решите первую задачу верно, чтобы попасть в общий зачёт!</span>
              </div>
            `;
          } else {
            summaryWrap.innerHTML = "";
          }
        } else {
          summaryWrap.innerHTML = "";
        }
      } catch (err) {
        console.error(err);
        card.innerHTML = `<div class="empty-note">Не удалось загрузить рейтинг: ${esc(err?.message || err)}</div>`;
      }
    }

    document.getElementById("btn-logout").addEventListener("click", () => {
      window.PhysAuth?.getAuth()?.signOut();
    });

    window.addEventListener("physauth:ready", loadRating);
  </script>
</body>
</html>
